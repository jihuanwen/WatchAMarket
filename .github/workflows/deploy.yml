name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Pages 部署所需最小权限（私有仓库 + Actions 部署关键）
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：避免旧部署未完成时新部署撞车
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 私有仓 + Actions 部署到 Pages 必须有的两步：
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 仓库根就是 PWA 根（mobile_board/ 整目录作为仓库根）
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
